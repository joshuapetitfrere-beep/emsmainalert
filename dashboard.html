<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EMS Incoming — Polk County</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080b10; --surface: #0d1117; --border: #1a2030; --muted: #3a4558;
      --text: #e2e8f0; --dim: #64748b; --red: #ef4444; --amber: #f59e0b;
      --blue: #3b82f6; --green: #22c55e;
      --font-mono: 'IBM Plex Mono', monospace; --font-sans: 'IBM Plex Sans', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow-x: hidden; }
    body::after { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px); pointer-events:none; z-index:9999; }

    /* Auth */
    #auth-screen { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:10000; }
    #auth-screen.hidden { display:none; }
    .auth-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:40px; width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; gap:24px; }
    .auth-logo { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:3px; color:var(--red); }
    .auth-title { font-size:20px; font-weight:800; text-align:center; }
    .auth-sub { font-size:13px; color:var(--dim); text-align:center; margin-top:-16px; }
    .auth-input { width:100%; background:#0d1117; border:1px solid var(--border); border-radius:10px; padding:14px 16px; color:var(--text); font-family:var(--font-mono); font-size:15px; letter-spacing:3px; text-align:center; outline:none; transition:border-color 0.2s; }
    .auth-input:focus { border-color:var(--blue); }
    .auth-input.error { border-color:var(--red); animation:shake 0.3s ease; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    .auth-btn { width:100%; background:var(--blue); border:none; border-radius:10px; padding:14px; color:#fff; font-family:var(--font-sans); font-size:14px; font-weight:800; cursor:pointer; }
    .auth-btn:hover { opacity:0.85; }
    .auth-error { font-family:var(--font-mono); font-size:11px; color:var(--red); display:none; }
    .auth-error.visible { display:block; }

    /* Trauma Banner */
    #trauma-banner { display:none; position:sticky; top:0; z-index:200; background:#450a0a; border-bottom:2px solid var(--red); padding:0 32px; animation:traumaFlash 1s ease-in-out infinite; }
    #trauma-banner.visible { display:block; }
    @keyframes traumaFlash { 0%,100%{background:#450a0a} 50%{background:#7f1d1d} }
    .trauma-inner { display:flex; align-items:center; justify-content:space-between; padding:14px 0; flex-wrap:wrap; gap:12px; }
    .trauma-left { display:flex; align-items:center; gap:14px; }
    .trauma-icon { font-size:28px; flex-shrink:0; }
    .trauma-title { font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--red); letter-spacing:2px; margin-bottom:4px; }
    .trauma-fields { display:flex; flex-wrap:wrap; gap:16px; margin-top:6px; }
    .trauma-field { display:flex; flex-direction:column; gap:2px; }
    .trauma-field-label { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:2px; color:#9b1c1c; }
    .trauma-field-value { font-family:var(--font-mono); font-size:13px; font-weight:700; color:#fca5a5; }
    .trauma-eta-value { font-size:20px; color:#fff; }
    .trauma-dismiss { background:rgba(0,0,0,0.3); border:1px solid #7f1d1d; color:#fca5a5; font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:1px; padding:8px 16px; border-radius:6px; cursor:pointer; flex-shrink:0; }
    .trauma-dismiss:hover { background:rgba(0,0,0,0.5); }

    /* Header */
    .header { display:flex; align-items:center; justify-content:space-between; padding:18px 32px; border-bottom:1px solid var(--border); background:var(--surface); position:sticky; top:0; z-index:100; }
    .header-left { display:flex; align-items:center; gap:16px; }
    .logo { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:3px; color:var(--red); }
    .header-title { font-size:15px; font-weight:800; }
    .hospital-badge { font-family:var(--font-mono); font-size:11px; font-weight:700; color:var(--blue); background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3); border-radius:6px; padding:4px 10px; }
    .header-right { display:flex; align-items:center; gap:20px; }
    .clock { font-family:var(--font-mono); font-size:13px; color:var(--dim); }
    .conn-badge { display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--dim); }
    .conn-dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background 0.3s; }
    .conn-dot.live { background:var(--green); box-shadow:0 0 8px var(--green); }
    .conn-dot.error { background:var(--red); }
    .sound-btn { background:transparent; border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--dim); font-family:var(--font-mono); font-size:11px; font-weight:700; cursor:pointer; transition:all 0.2s; letter-spacing:1px; }
    .sound-btn:hover { border-color:var(--muted); color:var(--text); }
    .sound-btn.on { border-color:var(--green); color:var(--green); }

    /* Filter bar */
    .filter-bar { display:flex; align-items:center; gap:10px; padding:14px 32px; border-bottom:1px solid var(--border); background:var(--bg); flex-wrap:wrap; }
    .filter-label { font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:2px; color:var(--muted); margin-right:4px; }
    .filter-btn { padding:6px 14px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--dim); font-family:var(--font-sans); font-size:12px; font-weight:600; cursor:pointer; transition:all 0.15s; white-space:nowrap; }
    .filter-btn:hover { border-color:var(--muted); color:var(--text); }
    .filter-btn.active { background:rgba(59,130,246,0.15); border-color:var(--blue); color:var(--blue); }

    /* Summary */
    .summary { display:flex; gap:24px; padding:12px 32px; border-bottom:1px solid var(--border); background:var(--surface); }
    .summary-item { display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:11px; }
    .summary-count { font-size:18px; font-weight:700; color:var(--text); }
    .summary-desc { color:var(--muted); letter-spacing:1px; }

    /* Main */
    .main { padding:32px; max-width:1200px; margin:0 auto; }
    .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:100px 32px; text-align:center; }
    .empty-icon { font-size:48px; margin-bottom:20px; opacity:0.3; }
    .empty-title { font-family:var(--font-mono); font-size:13px; font-weight:700; letter-spacing:2px; color:var(--muted); margin-bottom:8px; }
    .empty-sub { font-size:13px; color:var(--muted); }

    /* Cards */
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:20px; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; animation:slideIn 0.3s ease; }
    .card.has-trauma { border-color:#7f1d1d; }
    @keyframes slideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .card-accent { height:3px; width:100%; }
    .card-body { padding:20px; }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; }
    .unit-id { font-family:var(--font-mono); font-size:11px; font-weight:700; letter-spacing:2px; color:var(--dim); }
    .badge-row { display:flex; gap:6px; align-items:center; }
    .alert-type-badge { padding:3px 10px; border-radius:4px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:1px; }
    .trauma-badge { padding:3px 10px; border-radius:4px; font-family:var(--font-mono); font-size:10px; font-weight:700; letter-spacing:1px; background:rgba(239,68,68,0.2); color:#f87171; border:1px solid #7f1d1d; animation:pulseBadge 1.2s ease-in-out infinite; }
    @keyframes pulseBadge { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .card-hospital { font-size:18px; font-weight:800; color:var(--text); margin-bottom:16px; }
    .card-stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
    .stat { background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:8px; padding:12px; }
    .stat-label { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:2px; color:var(--muted); margin-bottom:6px; }
    .stat-value { font-family:var(--font-mono); font-size:22px; font-weight:700; line-height:1; }
    .stat-unit { font-size:11px; font-weight:400; color:var(--dim); margin-left:3px; }
    .eta-critical { color:var(--red); animation:pulse 1s ease-in-out infinite; }
    .eta-warn { color:var(--amber); }
    .eta-ok { color:var(--green); }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
    .trauma-strip { background:rgba(127,29,29,0.2); border:1px solid #7f1d1d; border-radius:8px; padding:10px 12px; margin-bottom:14px; }
    .trauma-strip-title { font-family:var(--font-mono); font-size:9px; font-weight:700; letter-spacing:2px; color:#9b1c1c; margin-bottom:8px; }
    .trauma-strip-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .trauma-strip-item { display:flex; flex-direction:column; gap:1px; }
    .trauma-strip-label { font-family:var(--font-mono); font-size:8px; letter-spacing:1px; color:#9b1c1c; }
    .trauma-strip-value { font-family:var(--font-mono); font-size:11px; color:#fca5a5; font-weight:600; }
    .card-footer { display:flex; justify-content:space-between; align-items:center; padding-top:12px; border-top:1px solid var(--border); }
    .activated-label { font-family:var(--font-mono); font-size:10px; color:var(--muted); }
    .live-badge { display:flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--green); letter-spacing:1px; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); animation:pulse 1.2s ease-in-out infinite; }

    .type-Medical  { background:rgba(59,130,246,0.15);  color:#60a5fa; }
    .type-Trauma   { background:rgba(239,68,68,0.15);   color:#f87171; }
    .type-Cardiac  { background:rgba(239,68,68,0.2);    color:#fca5a5; }
    .type-Stroke   { background:rgba(245,158,11,0.15);  color:#fcd34d; }
    .type-Fire     { background:rgba(249,115,22,0.15);  color:#fb923c; }
    .type-Police   { background:rgba(99,102,241,0.15);  color:#a5b4fc; }
    .type-Other    { background:rgba(100,116,139,0.15); color:#94a3b8; }
    .accent-Medical  { background:#3b82f6; }
    .accent-Trauma   { background:#ef4444; }
    .accent-Cardiac  { background:#ef4444; }
    .accent-Stroke   { background:#f59e0b; }
    .accent-Fire     { background:#f97316; }
    .accent-Police   { background:#6366f1; }
    .accent-Other    { background:#64748b; }

    @media (max-width:600px) {
      .header, .filter-bar, .main, .summary { padding-left:16px; padding-right:16px; }
      .cards { grid-template-columns:1fr; }
      #trauma-banner { padding:0 16px; }
      .auth-box { margin:16px; padding:32px 24px; }
    }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen">
    <div class="auth-box">
      <span class="auth-logo">EMS ALERT</span>
      <div>
        <div class="auth-title">Hospital Dashboard</div>
        <div class="auth-sub">Polk County EMS</div>
      </div>
      <input id="auth-input" class="auth-input" type="password" placeholder="••••••••"
        onkeydown="if(event.key==='Enter') submitAuth()" autofocus />
      <span class="auth-error" id="auth-error">Incorrect password. Try again.</span>
      <button class="auth-btn" onclick="submitAuth()">Access Dashboard</button>
    </div>
  </div>

  <!-- Trauma Banner -->
  <div id="trauma-banner">
    <div class="trauma-inner">
      <div class="trauma-left">
        <div class="trauma-icon">🚨</div>
        <div>
          <div class="trauma-title">TRAUMA ACTIVATION</div>
          <div class="trauma-fields" id="trauma-fields"></div>
        </div>
      </div>
      <button class="trauma-dismiss" onclick="dismissTrauma()">✕ DISMISS</button>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">EMS ALERT</span>
      <span class="header-title">Hospital Dashboard — Polk County</span>
      <span class="hospital-badge" id="hospital-badge" style="display:none;"></span>
    </div>
    <div class="header-right">
      <span class="clock" id="clock">--:--:--</span>
      <button class="sound-btn on" id="sound-btn" onclick="toggleSound()">🔔 SOUND ON</button>
      <div class="conn-badge">
        <div class="conn-dot" id="conn-dot"></div>
        <span id="conn-label">Connecting...</span>
      </div>
    </div>
  </header>

  <!-- Summary -->
  <div class="summary" id="summary" style="display:none;">
    <div class="summary-item">
      <span class="summary-count" id="count-incoming">0</span>
      <span class="summary-desc">INCOMING UNITS</span>
    </div>
    <div class="summary-item">
      <span class="summary-count" id="count-patients">0</span>
      <span class="summary-desc">TOTAL PATIENTS</span>
    </div>
  </div>

  <!-- Filter bar — hidden for hospital-specific logins -->
  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">Filter</span>
    <button class="filter-btn active" data-hospital="ALL" onclick="setFilter('ALL')">All Hospitals</button>
  </div>

  <!-- Main -->
  <main class="main">
    <div id="empty" class="empty">
      <div class="empty-icon">🏥</div>
      <div class="empty-title">No Incoming Units</div>
      <div class="empty-sub">Waiting for EMS alerts...</div>
    </div>
    <div class="cards" id="cards" style="display:none;"></div>
  </main>

  <script>
    // ── Auth ───────────────────────────────────────────────────────────────
    const MASTER_PASSWORD = "cpath42";
    let authedHospital = null; // null = all hospitals

    function submitAuth() {
      const input = document.getElementById('auth-input');
      const error = document.getElementById('auth-error');
      const pwd = input.value.trim();
      if (!pwd) return;

      // Check master password first
      if (pwd === MASTER_PASSWORD) {
        authedHospital = null;
        sessionStorage.setItem("dashboard_auth", pwd);
        sessionStorage.setItem("dashboard_hospital", "ALL");
        document.getElementById('auth-screen').classList.add('hidden');
        connect();
        render();
        return;
      }

      // Otherwise check hospital password via backend
      fetch(`/auth/hospital?password=${encodeURIComponent(pwd)}`, { method: 'POST' })
        .then(r => r.json())
        .then(data => {
          if (data.valid && data.hospital) {
            authedHospital = data.hospital;
            activeFilter = data.hospital;
            sessionStorage.setItem("dashboard_auth", pwd);
            sessionStorage.setItem("dashboard_hospital", data.hospital);
            document.getElementById('auth-screen').classList.add('hidden');
            // Show hospital badge and hide filter bar
            const badge = document.getElementById('hospital-badge');
            badge.textContent = data.hospital;
            badge.style.display = 'inline-block';
            document.getElementById('filter-bar').style.display = 'none';
            connect();
            render();
          } else {
            input.classList.add('error');
            error.classList.add('visible');
            input.value = '';
            setTimeout(() => input.classList.remove('error'), 400);
          }
        })
        .catch(() => {
          input.classList.add('error');
          error.classList.add('visible');
          input.value = '';
          setTimeout(() => input.classList.remove('error'), 400);
        });
    }

    // Restore session
    const savedAuth = sessionStorage.getItem("dashboard_auth");
    const savedHospital = sessionStorage.getItem("dashboard_hospital");
    if (savedAuth) {
      if (savedHospital && savedHospital !== "ALL") {
        authedHospital = savedHospital;
        activeFilter = savedHospital;
        const badge = document.getElementById('hospital-badge');
        badge.textContent = savedHospital;
        badge.style.display = 'inline-block';
        document.getElementById('filter-bar').style.display = 'none';
      }
      document.getElementById('auth-screen').classList.add('hidden');
    }

    // ── Sound ──────────────────────────────────────────────────────────────
    let soundEnabled = true;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      btn.textContent = soundEnabled ? '🔔 SOUND ON' : '🔕 SOUND OFF';
      btn.classList.toggle('on', soundEnabled);
    }

    function playNewUnitChime() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx();
        [880, 660].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.3);
          gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.3);
          gain.gain.linearRampToValueAtTime(0.4, ctx.currentTime + i * 0.3 + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.3 + 0.5);
          osc.start(ctx.currentTime + i * 0.3);
          osc.stop(ctx.currentTime + i * 0.3 + 0.5);
        });
      } catch (e) {}
    }

    function playTraumaChime() {
      if (!soundEnabled) return;
      const tones = [440, 660, 880];
      function playTones() {
        try {
          const ctx = getAudioCtx();
          tones.forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.25);
            gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.25);
            gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + i * 0.25 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.25 + 0.4);
            osc.start(ctx.currentTime + i * 0.25);
            osc.stop(ctx.currentTime + i * 0.25 + 0.4);
          });
        } catch (e) {}
      }
      playTones();
      setTimeout(playTones, 1200);
    }

    // ── State ──────────────────────────────────────────────────────────────
    let units = [];
    let hospitals = [];
    let activeFilter = 'ALL';
    let ws = null;
    let reconnectTimer = null;
    let traumaDismissed = false;
    let lastTraumaId = null;
    let knownUnitIds = new Set();
    let knownTraumaKeys = new Set();

    setInterval(() => {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('en-US', { hour12: false });
    }, 1000);

    // ── WebSocket ──────────────────────────────────────────────────────────
    const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/dashboard';

    function connect() {
      ws = new WebSocket(WS_URL);
      ws.onopen = () => { setConn(true); clearTimeout(reconnectTimer); };
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'dashboard_update') {
            const prevUnits = units;
            units = data.units || [];
            if (data.hospitals && data.hospitals.length) buildFilters(data.hospitals);

            // Detect new units
            units.forEach(u => {
              if (!knownUnitIds.has(u.unit_id)) {
                knownUnitIds.add(u.unit_id);
                if (prevUnits.length > 0 || knownUnitIds.size > 1) {
                  // Only chime if relevant to authed hospital
                  if (!authedHospital || u.destination_hospital === authedHospital) {
                    playNewUnitChime();
                  }
                }
              }
            });

            const activeIds = new Set(units.map(u => u.unit_id));
            knownUnitIds.forEach(id => { if (!activeIds.has(id)) knownUnitIds.delete(id); });

            // Detect new trauma
            units.forEach(u => {
              if (u.trauma) {
                const traumaKey = u.unit_id + u.trauma.activated_at;
                if (!knownTraumaKeys.has(traumaKey)) {
                  knownTraumaKeys.add(traumaKey);
                  if (!authedHospital || u.destination_hospital === authedHospital) {
                    playTraumaChime();
                  }
                }
              }
            });

            checkTraumaBanner();
            render();
          }
        } catch (err) {}
      };
      ws.onclose = () => { setConn(false); reconnectTimer = setTimeout(connect, 4000); };
      ws.onerror = () => ws.close();
    }

    function setConn(live) {
      document.getElementById('conn-dot').className = 'conn-dot ' + (live ? 'live' : 'error');
      document.getElementById('conn-label').textContent = live ? 'Live' : 'Reconnecting...';
    }

    // ── Trauma Banner ──────────────────────────────────────────────────────
    function checkTraumaBanner() {
      const relevant = units.filter(u => {
        if (!u.trauma) return false;
        if (activeFilter !== 'ALL' && u.destination_hospital !== activeFilter) return false;
        return true;
      });
      if (relevant.length === 0) { hideBanner(); return; }
      const latest = relevant.sort((a, b) =>
        new Date(b.trauma.activated_at) - new Date(a.trauma.activated_at))[0];
      const traumaKey = latest.unit_id + latest.trauma.activated_at;
      if (traumaKey !== lastTraumaId) { lastTraumaId = traumaKey; traumaDismissed = false; }
      if (!traumaDismissed) showBanner(latest);
    }

    function showBanner(unit) {
      const t = unit.trauma;
      const fields = [
        { label: 'UNIT', value: unit.unit_id },
        { label: 'ETA', value: t.eta_minutes != null ? t.eta_minutes + ' min' : '--', highlight: true },
        { label: 'MECHANISM', value: t.mechanism || '--' },
        { label: 'PATIENTS', value: t.num_patients || 1 },
        { label: 'AGE / SEX', value: [t.age, t.sex].filter(Boolean).join(' / ') || '--' },
        { label: 'VITALS', value: t.vitals || '--' },
        { label: 'GCS', value: t.gcs || '--' },
        { label: 'HOSPITAL', value: t.destination_hospital || '--' },
      ];
      document.getElementById('trauma-fields').innerHTML = fields.map(f => `
        <div class="trauma-field">
          <span class="trauma-field-label">${escHtml(f.label)}</span>
          <span class="trauma-field-value ${f.highlight ? 'trauma-eta-value' : ''}">${escHtml(String(f.value))}</span>
        </div>`).join('');
      document.getElementById('trauma-banner').classList.add('visible');
    }

    function hideBanner() { document.getElementById('trauma-banner').classList.remove('visible'); }
    function dismissTrauma() { traumaDismissed = true; hideBanner(); }

    // ── Filters ────────────────────────────────────────────────────────────
    function buildFilters(list) {
      hospitals = list;
      if (authedHospital) return; // hospital-specific login — no filter bar needed
      const bar = document.getElementById('filter-bar');
      bar.querySelectorAll('[data-hospital]:not([data-hospital="ALL"])').forEach(b => b.remove());
      list.forEach(h => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (activeFilter === h ? ' active' : '');
        btn.dataset.hospital = h;
        btn.textContent = h;
        btn.onclick = () => setFilter(h);
        bar.appendChild(btn);
      });
    }

    function setFilter(h) {
      activeFilter = h;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.hospital === h));
      checkTraumaBanner();
      render();
    }

    // ── Helpers ────────────────────────────────────────────────────────────
    function etaClass(min) {
      if (min == null) return '';
      if (min <= 5) return 'eta-critical';
      if (min <= 10) return 'eta-warn';
      return 'eta-ok';
    }

    function formatTime(iso) {
      if (!iso) return '--';
      try { return new Date(iso + 'Z').toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }); }
      catch { return '--'; }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function render() {
      const filtered = activeFilter === 'ALL' ? units : units.filter(u => u.destination_hospital === activeFilter);
      const empty = document.getElementById('empty');
      const cards = document.getElementById('cards');
      const summary = document.getElementById('summary');

      if (filtered.length === 0) {
        empty.style.display = 'flex'; cards.style.display = 'none'; summary.style.display = 'none';
        return;
      }

      empty.style.display = 'none'; cards.style.display = 'grid'; summary.style.display = 'flex';
      document.getElementById('count-incoming').textContent = filtered.length;
      document.getElementById('count-patients').textContent = filtered.reduce((s, u) => s + (u.num_patients || 1), 0);

      filtered.sort((a, b) => {
        if (a.eta_minutes == null) return 1;
        if (b.eta_minutes == null) return -1;
        return a.eta_minutes - b.eta_minutes;
      });

      cards.innerHTML = filtered.map(u => {
        const type = u.alert_type || 'Other';
        const eta = u.eta_minutes;
        const etaCls = etaClass(eta);
        const etaTxt = eta != null ? eta : '--';
        const pts = u.num_patients || 1;
        const hasT = !!u.trauma;

        const traumaStrip = hasT ? `
          <div class="trauma-strip">
            <div class="trauma-strip-title">🚨 TRAUMA ACTIVATED</div>
            <div class="trauma-strip-grid">
              <div class="trauma-strip-item"><span class="trauma-strip-label">MECHANISM</span><span class="trauma-strip-value">${escHtml(u.trauma.mechanism||'--')}</span></div>
              <div class="trauma-strip-item"><span class="trauma-strip-label">AGE / SEX</span><span class="trauma-strip-value">${escHtml([u.trauma.age,u.trauma.sex].filter(Boolean).join(' / ')||'--')}</span></div>
              <div class="trauma-strip-item"><span class="trauma-strip-label">VITALS</span><span class="trauma-strip-value">${escHtml(u.trauma.vitals||'--')}</span></div>
              <div class="trauma-strip-item"><span class="trauma-strip-label">GCS</span><span class="trauma-strip-value">${escHtml(u.trauma.gcs||'--')}</span></div>
            </div>
          </div>` : '';

        return `
          <div class="card ${hasT ? 'has-trauma' : ''}">
            <div class="card-accent accent-${type}"></div>
            <div class="card-body">
              <div class="card-top">
                <span class="unit-id">${escHtml(u.unit_id)}</span>
                <div class="badge-row">
                  ${hasT ? '<span class="trauma-badge">TRAUMA</span>' : ''}
                  <span class="alert-type-badge type-${type}">${escHtml(type)}</span>
                </div>
              </div>
              <div class="card-hospital">🏥 ${escHtml(u.destination_hospital||'Unknown')}</div>
              <div class="card-stats">
                <div class="stat"><div class="stat-label">ETA</div><div class="stat-value ${etaCls}">${etaTxt}<span class="stat-unit">${eta!=null?'min':''}</span></div></div>
                <div class="stat"><div class="stat-label">Patients</div><div class="stat-value" style="color:var(--text)">${pts}<span class="stat-unit">${pts===1?'pt':'pts'}</span></div></div>
              </div>
              ${traumaStrip}
              <div class="card-footer">
                <span class="activated-label">Activated ${formatTime(u.activated_at)}</span>
                <div class="live-badge"><div class="live-dot"></div>LIVE</div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    // ── Init ───────────────────────────────────────────────────────────────
    if (sessionStorage.getItem("dashboard_auth")) {
      connect();
      render();
    }
  </script>
</body>
</html>
